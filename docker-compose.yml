services:
  web:
    build: ./web
    image: smart-finance-web
    container_name: smart-finance
    restart: unless-stopped
    env_file:
      - path: .env
        required: false     # sin .env arranca en modo demo
    ports:
      # Solo escucha en tu propio ordenador: nadie de tu red puede entrar.
      # Para abrirlo a otros dispositivos de casa, cambia a "8000:8000".
      - "127.0.0.1:8000:8000"
