name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  atajo:
    name: Atajo del móvil
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Comprobar sintaxis
        run: npm run lint

      - name: Tests
        run: npm test

  web:
    name: Panel web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: web/requirements*.txt

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Tests
        run: pytest -v

  docker:
    name: Imagen Docker
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v4

      - name: Comprobar la configuración con el perfil de Tailscale
        run: COMPOSE_PROFILES=tailscale docker compose config -q

      - name: Construir y arrancar el contenedor
        run: docker compose up -d --build --wait

      - name: Comprobar que responde
        run: |
          curl -fsS http://127.0.0.1:8000/salud
          curl -fsS http://127.0.0.1:8000/ | grep -q "Tienes"

      - name: Logs si algo falla
        if: failure()
        run: docker compose logs

  secretos:
    name: Sin secretos en el repo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Comprobar que no se ha subido ningún token de Notion
        run: |
          if grep -rnE '(ntn_|secret_|tskey-[a-z]+-)[A-Za-z0-9]{16,}' --exclude-dir=.git .; then
            echo "::error::Hay un token de Notion o una clave de Tailscale en el repositorio"
            exit 1
          fi
